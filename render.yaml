# =============================================================================
# SCM FLOW — RENDER INFRASTRUCTURE BLUEPRINT (render.yaml)
# Deploy with 1-click on https://dashboard.render.com/blueprints
# =============================================================================

services:
  # 1. SCM Flow Node.js / Express Backend Web Service
  - type: web
    name: scm-flow-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: scm-flow-db
          property: connectionString

databases:
  # 2. Managed PostgreSQL Database for SCM Flow Schema & Migrations
  - name: scm-flow-db
    databaseName: scm_flow
    user: scm_user
    plan: free
    region: oregon
    postgresMajorVersion: 16

